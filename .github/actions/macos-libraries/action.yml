name: macOS libraries
description: Install the macOS build tools and restore, or build and cache, the dependencies.

inputs:
  repo-name:
    description: Name of the repository checkout directory inside the workspace.
    required: true
  save-cache:
    description: Save the libraries cache back. Only the warming workflow owns the cached entries.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install build tools
      id: toolchain
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      run: |
        test -d "$DEVELOPER_DIR"
        brew install automake libtool meson nasm ninja pkg-config wget ccache
        sudo xcode-select -s "$DEVELOPER_DIR"
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        toolchain_id=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -c1-16)
        echo "id=$toolchain_id" >> "$GITHUB_OUTPUT"
    - name: Restore libraries cache
      id: libraries-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          Libraries
          ThirdParty
        key: macos-universal-release-${{ steps.toolchain.outputs.id }}-${{ hashFiles(format('{0}/Telegram/build/prepare/**', inputs.repo-name), format('{0}/Telegram/build/qt_version.py', inputs.repo-name)) }}
        restore-keys: macos-universal-release-${{ steps.toolchain.outputs.id }}-
    - name: Prepare libraries
      shell: bash
      env:
        REPO: ${{ inputs.repo-name }}
      run: ./"$REPO"/Telegram/build/prepare/mac.sh silent qt-release-only
    - name: Prune libraries
      shell: bash
      run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete
    - name: Save libraries cache
      if: ${{ inputs.save-cache == 'true' && steps.libraries-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          Libraries
          ThirdParty
        key: ${{ steps.libraries-cache.outputs.cache-primary-key }}
