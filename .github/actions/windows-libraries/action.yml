name: Windows libraries
description: Set up the MSVC toolchain and restore, or build and cache, the dependencies.

inputs:
  build-root:
    description: Build root that holds the checkout, Libraries and ThirdParty.
    required: true
  repo-name:
    description: Name of the repository checkout directory inside the build root.
    required: true
  save-cache:
    description: Save the dependency caches back. Only the warming workflow owns the cached entries.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Read toolchain and cache key
      id: toolchain
      shell: bash
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
      run: |
        doc="$BUILD_ROOT/$REPO/docs/building-win.md"
        sdk=$(sed -n 's/.*\*\*\([^*]*\)\*\* SDK version.*/\1/p' "$doc" | head -1)
        test -n "$sdk"
        key=$( { sha256sum "$BUILD_ROOT/$REPO/Telegram/build/prepare/prepare.py"; printf '%s\n' "$sdk"; } | sha256sum | cut -d' ' -f1)
        echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Install Visual Studio ATL component
      shell: pwsh
      run: |
        $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
        $vswhere = Join-Path $installer 'vswhere.exe'
        $setup = Join-Path $installer 'setup.exe'
        $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
        $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
        $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
        if (-not $path) { throw "No Visual Studio instance provides $toolsComponent." }
        $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory |
          Where-Object { $_.Name -like '14.44.*' } |
          Sort-Object Name -Descending |
          Select-Object -First 1
        $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
        if (-not (Test-Path $header)) {
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$path`"", '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache')
          if ($process.ExitCode -notin @(0, 3010)) { exit $process.ExitCode }
        }
        if (-not (Test-Path $header)) { throw "ATL was not installed at $header." }
    - name: Native Tools Command Prompt
      uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
      with:
        arch: x64
        sdk: ${{ steps.toolchain.outputs.sdk }}
        toolset: '14.44'
    - name: Restore ThirdParty cache
      id: third-party-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.build-root }}\ThirdParty
        key: windows-x64-third-party-${{ steps.toolchain.outputs.key }}
        restore-keys: windows-x64-third-party-
    - name: Restore libraries cache
      id: libraries-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.build-root }}\Libraries\win64
        key: windows-x64-release-libraries-${{ steps.toolchain.outputs.key }}
        restore-keys: windows-x64-release-libraries-
    - name: Prepare libraries
      shell: cmd
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
      run: call %BUILD_ROOT%\%REPO%\Telegram\build\prepare\win.bat silent
    - name: Prune libraries
      shell: bash
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
      run: find "$BUILD_ROOT/Libraries/win64" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
    - name: Save ThirdParty cache
      if: ${{ inputs.save-cache == 'true' && steps.third-party-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.build-root }}\ThirdParty
        key: ${{ steps.third-party-cache.outputs.cache-primary-key }}
    - name: Save libraries cache
      if: ${{ inputs.save-cache == 'true' && steps.libraries-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.build-root }}\Libraries\win64
        key: ${{ steps.libraries-cache.outputs.cache-primary-key }}
