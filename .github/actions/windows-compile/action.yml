name: Windows compile
description: Restore the compiler cache, configure and build the Release target, and report build times.

inputs:
  build-root:
    description: Build root that holds the checkout, the libraries and the compiler cache.
    required: true
  repo-name:
    description: Name of the repository checkout directory inside the build root.
    required: true
  revision:
    description: Commit the sources come from, the immutable tail of the compiler cache key.
    required: true
  api-id:
    description: Telegram application identifier.
    required: true
  api-hash:
    description: Telegram application hash.
    required: true
  save-cache:
    description: Save the compiler cache back. Only the warming workflow owns the cached entries.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install the compiler cache
      shell: pwsh
      run: |
        choco install ccache --version=4.14.0 --no-progress -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ccache --version
    - name: Compiler cache key
      id: cache-key
      shell: bash
      env:
        REVISION: ${{ inputs.revision }}
      run: |
        test -n "$REVISION"
        echo "prefix=ccache-windows-x64-release" >> "$GITHUB_OUTPUT"
    - name: Restore compiler cache
      id: compiler-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.build-root }}\ccache
        key: ${{ steps.cache-key.outputs.prefix }}-${{ inputs.revision }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}-
    - name: Reset compiler cache counters
      continue-on-error: true
      shell: bash
      env:
        CCACHE_DIR: ${{ inputs.build-root }}\ccache
      run: ccache --zero-stats > /dev/null
    - name: Configure Release
      shell: cmd
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
        API_ID: ${{ inputs.api-id }}
        API_HASH: ${{ inputs.api-hash }}
        CCACHE_DIR: ${{ inputs.build-root }}\ccache
        CCACHE_DEPEND: 'true'
        CCACHE_MAXSIZE: 2G
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: |
        cd /d %BUILD_ROOT%\%REPO%\Telegram
        call configure.bat -G "Ninja Multi-Config" ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_EXPORT_COMPILE_COMMANDS=ON ^
          "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=" ^
          -D CMAKE_C_COMPILER_LAUNCHER=ccache ^
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -D "TDESKTOP_API_ID=%API_ID%" ^
          -D "TDESKTOP_API_HASH=%API_HASH%" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
    - name: Verify Release configuration
      shell: pwsh
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
      run: |
        $out = Join-Path $env:BUILD_ROOT "$env:REPO\out"
        $cache = @{}
        Get-Content (Join-Path $out 'CMakeCache.txt') | ForEach-Object {
          if ($_ -match '^([^:#/][^:=]*):[^=]+=(.*)$') { $cache[$Matches[1]] = $Matches[2] }
        }
        if ($cache['CMAKE_CONFIGURATION_TYPES'] -ne 'Release') { throw 'Not a Release-only build.' }
        if ($cache['DESKTOP_APP_DISABLE_AUTOUPDATE'] -ne 'ON') { throw 'Updater is enabled.' }
        if ($cache['CMAKE_C_COMPILER_LAUNCHER'] -ne 'ccache' -or $cache['CMAKE_CXX_COMPILER_LAUNCHER'] -ne 'ccache') {
          throw 'Compiler cache is not wired into the build.'
        }
        $commands = Get-Content (Join-Path $out 'compile_commands.json') -Raw
        if ($commands -notmatch 'Telegram[/\\]SourceFiles' -or $commands -notmatch '(/O2|-O2)' -or $commands -notmatch 'NDEBUG') {
          throw 'Release compilation flags were not generated.'
        }
        if ($commands -match ' /Z(7|i) ') { throw 'Release objects include debug information.' }
    - name: Build AyuGram
      shell: cmd
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
        CCACHE_DIR: ${{ inputs.build-root }}\ccache
        CCACHE_DEPEND: 'true'
        CCACHE_MAXSIZE: 2G
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: cmake --build %BUILD_ROOT%\%REPO%\out --config Release --parallel --target Telegram
    - name: Build statistics
      if: always()
      continue-on-error: true
      shell: bash
      env:
        BUILD_ROOT: ${{ inputs.build-root }}
        REPO: ${{ inputs.repo-name }}
        CCACHE_DIR: ${{ inputs.build-root }}\ccache
        CCACHE_MAXSIZE: 2G
      run: |
        python "$BUILD_ROOT/$REPO/Telegram/build/ninja_log_stats.py" "$BUILD_ROOT/$REPO/out/.ninja_log" \
          --title 'Windows x64 Release' --markdown-file "$GITHUB_STEP_SUMMARY"
        df -h || true
        {
          echo
          echo '<details><summary>Windows compiler cache and disk</summary>'
          echo
          echo '```'
          ccache --show-stats -v || true
          echo
          df -h || true
          echo '```'
          echo
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Save compiler cache
      if: ${{ success() && inputs.save-cache == 'true' && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.build-root }}\ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
