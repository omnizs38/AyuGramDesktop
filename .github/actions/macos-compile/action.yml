name: macOS compile
description: Restore the compiler cache, build one architecture and report build times and memory pressure.

inputs:
  repo-name:
    description: Name of the repository checkout directory inside the workspace.
    required: true
  architecture:
    description: Single macOS architecture to build.
    required: true
  swift-target:
    description: Swift deployment target triple that matches the architecture.
    required: true
  revision:
    description: Commit the sources come from, the immutable tail of the compiler cache key.
    required: true
  api-id:
    description: Telegram application identifier.
    required: true
  api-hash:
    description: Telegram application hash.
    required: true
  save-cache:
    description: Save the compiler cache back. Only the warming workflow owns the cached entries.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Compiler cache key
      id: cache-key
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        REVISION: ${{ inputs.revision }}
      run: |
        test -n "$REVISION"
        echo "prefix=ccache-macos-$ARCHITECTURE-release" >> "$GITHUB_OUTPUT"
    - name: Restore compiler cache
      id: compiler-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache-key.outputs.prefix }}-${{ inputs.revision }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}-
    - name: Reset compiler cache counters
      continue-on-error: true
      shell: bash
      env:
        CCACHE_DIR: ${{ github.workspace }}/ccache
      run: ccache --zero-stats > /dev/null
    - name: Build ${{ inputs.architecture }} Release
      shell: bash
      working-directory: ${{ inputs.repo-name }}/Telegram
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        SWIFT_TARGET: ${{ inputs.swift-target }}
        TDESKTOP_API_ID: ${{ inputs.api-id }}
        TDESKTOP_API_HASH: ${{ inputs.api-hash }}
        CCACHE_DIR: ${{ github.workspace }}/ccache
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_MAXSIZE: 2G
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: |
        export CMAKE_BUILD_TYPE=Release
        rm -rf ../out
        ./configure.sh -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          "-DCMAKE_OSX_ARCHITECTURES=$ARCHITECTURE" \
          "-DCMAKE_Swift_FLAGS=-target $SWIFT_TARGET" \
          "-DDESKTOP_APP_MAC_ARCH=$ARCHITECTURE" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
          '-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp' \
          '-DCMAKE_OBJCXX_FLAGS=-Xclang -fno-pch-timestamp' \
          "-DTDESKTOP_API_ID=$TDESKTOP_API_ID" \
          "-DTDESKTOP_API_HASH=$TDESKTOP_API_HASH" \
          -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON
        python3 build/check_macos_release.py ../out \
          --architectures "$ARCHITECTURE"
        while :; do
          printf '%s swap=%s pageouts=%s\n' \
            "$(date -u +%H:%M:%S)" \
            "$(sysctl -n vm.swapusage | sed -n 's/.*used = \([0-9.]*\)M.*/\1/p')" \
            "$(vm_stat | sed -n 's/^Pageouts: *\([0-9]*\)\./\1/p')"
          sleep 60 & wait $!
        done > "$RUNNER_TEMP/memory.log" 2>&1 &
        sampler=$!
        trap 'kill "$sampler" 2> /dev/null || true' EXIT
        cmake --build ../out --parallel 3 --target Telegram
        mkdir -p "../mac-apps/$ARCHITECTURE"
        ditto ../out/AyuGram.app "../mac-apps/$ARCHITECTURE/AyuGram.app"
        tar -C ../mac-apps -cf "../mac-apps/$ARCHITECTURE.tar" "$ARCHITECTURE"
    - name: Build statistics
      if: always()
      continue-on-error: true
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        REPO: ${{ inputs.repo-name }}
        CCACHE_DIR: ${{ github.workspace }}/ccache
        CCACHE_MAXSIZE: 2G
      run: |
        python3 "$REPO/Telegram/build/ninja_log_stats.py" "$REPO/out/.ninja_log" \
          --title "macOS $ARCHITECTURE Release" --markdown-file "$GITHUB_STEP_SUMMARY"
        {
          echo
          echo "<details><summary>macOS $ARCHITECTURE compiler cache and memory</summary>"
          echo
          echo '```'
          ccache --show-stats -v || true
          echo
          awk '{ last = $0
                 for (i = 1; i <= NF; i++) if ($i ~ /^swap=/) { v = substr($i, 6) + 0; if (v >= peak) { peak = v; line = $0 } } }
               END { if (NR) print "samples: " NR "\npeak:  " line "\nlast:  " last }' \
            "$RUNNER_TEMP/memory.log" 2> /dev/null || true
          echo '```'
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Save compiler cache
      if: ${{ success() && inputs.save-cache == 'true' && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
