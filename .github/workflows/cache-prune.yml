name: Cache prune

# Called twice by `Cache warm`: before the builds, so the uploads have room,
# and after them, so the entry they superseded does not sit in the ten
# gigabyte budget until the next scheduled run two days later.
on:
  workflow_call:

jobs:
  prune:
    name: Prune caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
    steps:
      - name: Drop superseded caches
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | {id, key, ref, created_at}' | jq -s . > caches.json
          python3 - <<'PY' > drop.txt
          import json, os, re
          default = os.environ["DEFAULT_REF"]
          owned = ("ccache-macos-", "ccache-windows-",
                   "macos-universal-release-", "windows-x64-")
          newest = {}
          for cache in json.load(open("caches.json")):
              if not cache["key"].startswith(owned):
                  continue
              if cache["ref"] != default:
                  print(cache["id"], "off the default branch", cache["key"])
                  continue
              family = re.sub(r"(-[0-9a-f]{7,})+$", "", cache["key"])
              known = newest.get(family)
              if known is None:
                  newest[family] = cache
              elif known["created_at"] < cache["created_at"]:
                  newest[family] = cache
                  print(known["id"], "superseded", known["key"])
              else:
                  print(cache["id"], "superseded", cache["key"])
          PY
          while read -r id reason; do
            echo "Deleting $id, $reason."
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" < /dev/null \
              || echo "::warning::Cache $id is already gone."
          done < drop.txt
