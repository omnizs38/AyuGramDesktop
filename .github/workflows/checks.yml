name: Source checks

on:
  pull_request:
  push:
    paths-ignore: ['**.md', 'LICENSE', 'LEGAL']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Build configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build configuration tests
        run: python3 -B -m unittest discover -s Telegram/build -p 'test_*.py'
      - name: Preparation syntax
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("Telegram/build/prepare/prepare.py").read_text())'

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Run actionlint
        run: |
          set -o pipefail
          lint="$RUNNER_TEMP/actionlint"
          rm -rf "$lint"
          mkdir -p "$lint/.github"
          cp -R .github/workflows "$lint/.github/"
          # `uses: ./...` resolves from the repository root while the build
          # jobs check out into a subdirectory, so stage every layout the
          # workflows name. An unresolvable path is not an actionlint error,
          # it is silence, so assert each one instead of trusting the copy.
          actions=$(grep -hoE '^[[:space:]]*uses: \./[^[:space:]]*' .github/workflows/*.yml \
            | sed 's|.*uses: \./||' | grep -v '^\.github/workflows/' | sort -u)
          while read -r action; do
            root=$(dirname "$(dirname "$(dirname "$action")")")
            mkdir -p "$lint/$root/.github"
            test -d "$lint/$root/.github/actions" \
              || cp -R .github/actions "$lint/$root/.github/"
            test -f "$lint/$action/action.yml" \
              || { echo "::error::No composite action behind ./$action"; exit 1; }
          done <<< "$actions"
          git -C "$lint" init -q
          cd "$lint"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  actions:
    name: Composite action validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate composite actions
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
          python3 .github/lint_actions.py

  linux-action-shell:
    name: Linux action shell (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: source
            index: 0
          - check: image
            index: 1
          - check: build
            index: 2
          - check: package
            index: 3
          - check: statistics
            index: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract and lint action step
        env:
          STEP_INDEX: ${{ matrix.index }}
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import yaml

          action = yaml.safe_load(pathlib.Path('.github/actions/linux-build/action.yml').read_text())
          script = action['runs']['steps'][int(os.environ['STEP_INDEX'])]['run']
          script = re.sub(r'\$\{\{.*?\}\}', 'expression', script, flags=re.DOTALL)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'linux-action-step.sh').write_text(script)
          PY
          shellcheck "$RUNNER_TEMP/linux-action-step.sh"

  linux-package:
    name: Linux package contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: CI script validation
        run: shellcheck .github/scripts/package_linux.sh
      - name: Linux package smoke test
        run: |
          cc -O2 -x c -o "$RUNNER_TEMP/linux-ci-smoke" - <<'EOF'
          int main(void) { return 0; }
          EOF
          version=$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)
          revision=$(git rev-parse HEAD)
          LINUX_CI_MAX_GLIBC=999 bash .github/scripts/package_linux.sh \
            "$RUNNER_TEMP/linux-ci-smoke" "$version" "$revision" \
            "$RUNNER_TEMP/linux-package-one" source-check-smoke
          LINUX_CI_MAX_GLIBC=999 bash .github/scripts/package_linux.sh \
            "$RUNNER_TEMP/linux-ci-smoke" "$version" "$revision" \
            "$RUNNER_TEMP/linux-package-two" source-check-smoke
          cmp \
            "$RUNNER_TEMP/linux-package-one/AyuGram-$version-linux-x64.tar.xz" \
            "$RUNNER_TEMP/linux-package-two/AyuGram-$version-linux-x64.tar.xz"
          cd "$RUNNER_TEMP/linux-package-one"
          sha256sum --check SHA256SUMS.txt
