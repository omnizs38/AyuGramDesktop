name: Apply Ayu improvement pack

on:
  push:
    branches: [improve/security-reliability-pack]
    paths: [.github/workflows/apply-ayu-improvements.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed source changes
        shell: bash
        run: |
          cat .github/ayu-improvements/part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/ayu-improvements.patch"
          git apply --check "$RUNNER_TEMP/ayu-improvements.patch"
          git apply "$RUNNER_TEMP/ayu-improvements.patch"
          rm -rf -- .github/ayu-improvements
          rm -- .github/workflows/apply-ayu-improvements.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Harden Ayu data and network boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
