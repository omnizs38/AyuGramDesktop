name: Cache warm

on:
  schedule:
    - cron: '20 4 * * 1,3,5'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build, empty for the newest release branch
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: false

env:
  # Duplicated as a literal in every `uses: ./...` path below, because `uses:`
  # forbids expressions. Change the four literals together with this value.
  REPO_NAME: AyuGramDesktop

jobs:
  resolve:
    name: Resolve release branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Require the default branch
        env:
          CURRENT: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$CURRENT" != "$DEFAULT" ]; then
            echo "Caches written by a run on $CURRENT are readable only from $CURRENT." >&2
            echo "Dispatch this workflow on $DEFAULT so every release branch can read them." >&2
            exit 1
          fi
      - name: Validate application credentials
        env:
          TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [[ ! "$TDESKTOP_API_ID" =~ ^[1-9][0-9]*$ || ! "$TDESKTOP_API_HASH" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo 'Set TDESKTOP_API_ID and TDESKTOP_API_HASH in repository Actions settings.' >&2
            exit 1
          fi
      - name: Pick the branch to build
        id: pick
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          heads=$(git ls-remote --heads "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'refs/heads/codex/ayu-*')
          candidates=$(printf '%s\n' "$heads" | sed -n \
            's|^[0-9a-f]\{40,\}[[:space:]]refs/heads/\(codex/ayu-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$|\1|p' \
            | sort -V)
          if [ -n "$REQUESTED_REF" ]; then
            ref=$(printf '%s\n' "$candidates" | grep -Fx -- "$REQUESTED_REF" | head -1 || true)
          else
            ref=$(printf '%s\n' "$candidates" | tail -1)
          fi
          if [ -z "$ref" ]; then
            echo "No release branch to warm. Candidates:" >&2
            printf '%s\n' "$candidates" >&2
            exit 1
          fi
          sha=$(printf '%s\n' "$heads" | awk -v want="refs/heads/$ref" '$2 == want { print $1; exit }')
          test -n "$sha"
          echo "Warming caches from $ref at $sha."
          { echo "ref=$ref"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  prune:
    name: Prune caches
    needs: resolve
    permissions:
      actions: write
    uses: ./.github/workflows/cache-prune.yml

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: [resolve, prune]
    runs-on: macos-15
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            swift_target: arm64-apple-macos11.0
          - architecture: x86_64
            swift_target: x86_64-apple-macos10.13
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          path: ${{ env.REPO_NAME }}
          persist-credentials: false
      - name: Verify the action contract
        env:
          ACTIONS: ${{ github.workspace }}/${{ env.REPO_NAME }}/.github/actions
        run: |
          for action in macos-libraries macos-compile; do
            grep -q '^  save-cache:' "$ACTIONS/$action/action.yml" \
              || { echo "$action on the warmed branch cannot save caches." >&2; exit 1; }
          done
      - name: Prepare libraries
        uses: ./AyuGramDesktop/.github/actions/macos-libraries
        with:
          repo-name: ${{ env.REPO_NAME }}
          # One universal libraries cache serves both architectures, so only one
          # job uploads it; a second upload of the same key is discarded anyway.
          save-cache: ${{ matrix.architecture == 'arm64' }}
      - name: Compile
        uses: ./AyuGramDesktop/.github/actions/macos-compile
        with:
          repo-name: ${{ env.REPO_NAME }}
          architecture: ${{ matrix.architecture }}
          swift-target: ${{ matrix.swift_target }}
          revision: ${{ needs.resolve.outputs.sha }}
          api-id: ${{ vars.TDESKTOP_API_ID }}
          api-hash: ${{ secrets.TDESKTOP_API_HASH }}
          save-cache: 'true'

  # Split because building the dependencies from source and compiling the
  # application do not fit on one runner's disk. Each job now repeats a profile
  # known to fit, at the price of a second checkout and toolchain install.
  windows-libraries:
    name: Windows x64 libraries
    needs: [resolve, prune]
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prepare directories
        run: |
          $build = Join-Path $env:USERPROFILE 'TBuild'
          New-Item -ItemType Directory -Force (Join-Path $build 'Libraries\win64') | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $env:GITHUB_WORKSPACE 'TBuild') -Target $build | Out-Null
          "TBUILD=$(Join-Path $env:GITHUB_WORKSPACE 'TBuild')" | Out-File $env:GITHUB_ENV -Append
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          persist-credentials: false
      - name: Verify the action contract
        shell: bash
        env:
          ACTIONS: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\.github\actions
        run: |
          for action in windows-libraries windows-compile; do
            grep -q '^  save-cache:' "$ACTIONS/$action/action.yml" \
              || { echo "$action on the warmed branch cannot save caches." >&2; exit 1; }
          done
      - name: Prepare libraries
        uses: ./TBuild/AyuGramDesktop/.github/actions/windows-libraries
        with:
          build-root: ${{ env.TBUILD }}
          repo-name: ${{ env.REPO_NAME }}
          save-cache: 'true'

  windows:
    name: Windows x64
    needs: [resolve, windows-libraries]
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prepare directories
        run: |
          $build = Join-Path $env:USERPROFILE 'TBuild'
          New-Item -ItemType Directory -Force (Join-Path $build 'Libraries\win64') | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $env:GITHUB_WORKSPACE 'TBuild') -Target $build | Out-Null
          "TBUILD=$(Join-Path $env:GITHUB_WORKSPACE 'TBuild')" | Out-File $env:GITHUB_ENV -Append
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          persist-credentials: false
      - name: Verify the action contract
        shell: bash
        env:
          ACTIONS: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\.github\actions
        run: |
          for action in windows-libraries windows-compile; do
            grep -q '^  save-cache:' "$ACTIONS/$action/action.yml" \
              || { echo "$action on the warmed branch cannot save caches." >&2; exit 1; }
          done
      - name: Restore libraries
        uses: ./TBuild/AyuGramDesktop/.github/actions/windows-libraries
        with:
          build-root: ${{ env.TBUILD }}
          repo-name: ${{ env.REPO_NAME }}
          save-cache: 'false'
      - name: Compile
        uses: ./TBuild/AyuGramDesktop/.github/actions/windows-compile
        with:
          build-root: ${{ env.TBUILD }}
          repo-name: ${{ env.REPO_NAME }}
          revision: ${{ needs.resolve.outputs.sha }}
          api-id: ${{ vars.TDESKTOP_API_ID }}
          api-hash: ${{ secrets.TDESKTOP_API_HASH }}
          save-cache: 'true'

  prune-after:
    name: Prune superseded caches
    needs: [resolve, macos, windows-libraries, windows]
    if: always() && needs.resolve.result == 'success'
    permissions:
      actions: write
    uses: ./.github/workflows/cache-prune.yml

  report:
    name: Report caches
    needs: [resolve, macos, windows-libraries, windows, prune-after]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      WARMED_REF: ${{ needs.resolve.outputs.ref }}
    steps:
      - name: Summarize caches
        run: |
          {
            echo "### Caches after warming $WARMED_REF"
            echo
            echo "| Size | Last used | Branch | Key |"
            echo "| ---: | --- | --- | --- |"
            # shellcheck disable=SC2016
            gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json sizeInBytes,lastAccessedAt,ref,key \
              --jq '.[] | "| \(.sizeInBytes / 1048576 | floor) MB | \(.lastAccessedAt) | \(.ref) | `\(.key)` |"'
            echo
            gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
              --jq '"Total: \(.active_caches_size_in_bytes / 1048576 | floor) MB in \(.active_caches_count) caches, GitHub allows 10240 MB."'
          } >> "$GITHUB_STEP_SUMMARY"
